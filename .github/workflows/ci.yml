name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：默认只读
permissions:
  contents: read

jobs:
  test:
    name: 回归自测
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README 声明最低 3.8，就按最低版本也跑一遍
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 跑自测
        working-directory: scripts
        run: python self_test.py

  web:
    name: 构建网页版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 生成单文件网页
        run: python web/build_web.py

      # 产物必须自洽：占位符填完、8 个引擎模块都在且顺序正确、
      # 零外链（无 CDN、无 wasm 运行时）。只用标准库，不给 CI 引入额外依赖。
      - name: 校验产物
        run: python web/verify_dist.py

      - name: 扫敏感信息
        run: python web/check_secrets.py

      # 扫描器自己也可能是坏的 —— 一个把所有规则写坏的扫描器
      # 同样会输出「未发现敏感信息」。这条确认它真的会拦。
      - name: 敏感信息扫描器自检
        run: python web/test_secret_scanner.py

      # 静态检查抓不到「静态看着对、实际跑不起来」。历史上两次线上事故
      # 都是这个形态（缺 pyodide.asm.js、进度条永远停在 3%）。
      # 这里把产物里的引擎抠出来在 Node 里真跑一遍。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 端到端验证内联引擎
        run: python web/test_load_chain.py

      # 引擎对了不等于页面能用：表单交互（bind/collect/submit）挂在 DOM 事件上，
      # 引擎全对、界面全哑是完全可能的，而且不报任何错。
      # 实际踩过：换成内联 JS 时把加载成功分支里的 bind() 一起删了，
      # 线上「页面正常打开但点排盘毫无反应」。这条门禁专门防这个。
      - name: 端到端验证页面交互
        run: python web/test_ui_chain.py

      # 元素「有内容但不可见」这类 bug，逻辑测试抓不到 ——
      # innerHTML 确实写进去了，只是 CSS 的 display:none 把它藏了。
      # 实际踩过：setStatus() 忘了加 show，于是「请先选择阳历生日」
      # 这类提示全部隐形，用户看到的现象是「点排盘没反应」。
      - name: 校验显隐契约
        run: python web/check_visibility.py

      # JS 移植与 Python 引擎的逐案对拍。
      # 引入第二份实现后，两边必然漂移；这条门禁保证它们始终一致。
      # 含 render 层：HTML 逐字比对，能抓出「值对了但拼错位置」的错误。
      - name: Python ↔ JS 引擎对拍
        run: python web/diff_py_js.py --layer all

      # 上面那 512 个用例**全部走 birthTime**，一个都没走 shichen
      #（页面上点十二时辰格子那条路）。曾因此漏掉一个时辰映射 off-by-one，
      # 而「只知道大概时辰」是最常见的用法。这条专门覆盖它。
      - name: 时辰路径对拍
        run: python web/check_shichen_map.py && python web/check_shichen_js.py

      # pyRoundN 的平局分支只在「值恰好落在十进制平局点」时触发，
      # 真实数据里极罕见 —— 512 个排盘用例全都可能绕过去。
      - name: 舍入语义对拍
        run: python web/check_round.py

      # 命理以北京时间为准，但浏览器跑在用户本机时区。
      # 一处 new Date() 就会让非 UTC+8 的用户静默算错。
      - name: 时区无关性
        run: python web/check_timezone.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: 部署到 GitHub Pages
    needs: [test, web]        # 自测或构建不过就不上线
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4