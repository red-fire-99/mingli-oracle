name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：默认只读
permissions:
  contents: read

jobs:
  test:
    name: 回归自测
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README 声明最低 3.8，就按最低版本也跑一遍
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 跑自测
        working-directory: scripts
        run: python self_test.py

  web:
    name: 构建网页版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 生成单文件网页
        run: python web/build_web.py

      # 自托管 Pyodide：运行时随站点一起发布，浏览器从同源取，不依赖公共 CDN。
      # 主路径取整包 tgz（npmmirror 约 3s / 5.6MB，且四个文件齐全）；
      # 逐文件下载作为兜底。
      - name: 下载 Pyodide 运行时（自托管）
        run: python web/fetch_pyodide.py --out web/dist/pyodide

      # 构建产物必须自洽：占位符填完、7 个模块都在、内联的 Python 语法配平。
      # 这些断言全部只用标准库，不给 CI 引入额外依赖。
      - name: 校验产物
        run: python web/verify_dist.py

      - name: 扫敏感信息
        run: python web/check_secrets.py

      # 加载回退逻辑的 bug 静态检查抓不到（作用域绑定、递归守卫、
      # 组合推进顺序），必须真跑一遍。历史上就因此把「进度条永远停在 3%」
      # 发布到了线上。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 端到端验证加载状态机
        run: python web/test_load_chain.py

      # JS 移植与 Python 引擎的逐案对拍。
      # 引入第二份实现后，两边必然漂移；这条门禁保证它们始终一致。
      - name: Python ↔ JS 引擎对拍
        run: python web/diff_py_js.py --layer all

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: 部署到 GitHub Pages
    needs: [test, web]        # 自测或构建不过就不上线
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4